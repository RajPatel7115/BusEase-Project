{% extends 'myapp/base.html' %}
{% load static %}

{% block title %}Search Buses · BusEase{% endblock %}
{% block page_id %}search{% endblock %}

{% block content %}

<section class="container py-4">
  <div id="be-search-host" class="mb-4"></div>

  <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <div>
      <div class="text-xs text-muted font-mono uppercase tracking-widest">// AVAILABLE BUSES</div>
      <h2 class="text-3xl font-extrabold m-0">
        <span id="srch-from">Mumbai</span> <span class="text-primary mx-1">→</span> <span id="srch-to">Pune</span>
      </h2>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="badge rounded-pill bg-muted text-fg px-3 py-2 font-mono font-bold" id="srch-count">0 buses found</span>
      <button class="btn-be btn-outline-be d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#srch-filters">
        ⚙ Filter Results
      </button>
    </div>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3 d-none d-lg-block">
      <div class="be-card p-4 sticky-top shadow-soft" style="border-radius:1.25rem; top:5.5rem;">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="font-bold m-0 d-flex align-items-center gap-2">
            <span>⚙</span> Filters
          </h6>
          <button type="button" class="btn-be btn-ghost-be p-0 text-xs text-primary" id="srch-reset-btn">Reset</button>
        </div>
        <div id="srch-filter-body"></div>
      </div>
    </aside>
    <div class="col-lg-9">
      <div id="srch-results" class="d-flex flex-column gap-3"></div>
    </div>
  </div>
</section>

<div class="offcanvas offcanvas-end" id="srch-filters" tabindex="-1">
  <div class="offcanvas-header border-b-be">
    <h5 class="offcanvas-title font-bold">Filter Buses</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body" id="srch-filter-body-mobile"></div>
</div>

{% endblock %}

{% block extra_scripts %}
<script src="{% static 'myapp/assets/js/search-form.js' %}?v=3.3"></script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const from = BE.qs('from','Mumbai'), to = BE.qs('to','Pune'), date = BE.qs('date', BE.fmtISO(new Date()));
  document.getElementById('srch-from').textContent = from;
  document.getElementById('srch-to').textContent = to;
  renderSearchForm(document.getElementById('be-search-host'), {from,to,date});

  const all = {{ buses_json|safe }};
  const types = [...new Set(all.map(b=>b.type))];
  const state = { maxPrice:5000, types:[], dep:'any', sort:'featured', vipOnly:false };

  function buildFilters(host){
    host.innerHTML = `
      <div class="mb-3 p-2.5 rounded-2xl transition-all" style="background:linear-gradient(135deg,rgba(245,158,11,0.14),rgba(99,102,241,0.12)); border:1.5px solid rgba(245,158,11,0.4); box-shadow:0 4px 15px rgba(245,158,11,0.1);">
        <label class="d-flex align-items-center justify-content-between text-sm m-0" style="cursor:pointer;">
          <span class="font-extrabold d-flex align-items-center gap-1.5" style="color:#b45309;">
            <span>👑</span> VIP & First Class Only
          </span>
          <input type="checkbox" class="form-check-input srch-vip-toggle m-0" ${state.vipOnly?'checked':''} style="cursor:pointer; width:1.25rem; height:1.25rem;">
        </label>
      </div>
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <label class="label-be tiny font-bold">Max Price</label>
          <span class="font-mono font-bold text-primary text-sm" id="mp-${host.id}">₹${state.maxPrice}</span>
        </div>
        <input type="range" min="400" max="5000" step="50" value="${state.maxPrice}" class="form-range mt-2 srch-mp">
        <div class="d-flex justify-content-between text-xs text-muted font-mono mt-1"><span>₹400</span><span>₹5000+</span></div>
      </div>
      <div class="mb-4">
        <label class="label-be tiny font-bold mb-2">Bus Category / Type</label>
        <div class="d-flex flex-column gap-2">
          ${types.map(t=>`
            <label class="d-flex align-items-center gap-2 text-sm p-1 rounded hover-lift" style="cursor:pointer;">
              <input type="checkbox" class="form-check-input srch-type m-0" value="${t}" ${state.types.includes(t)?'checked':''}>
              <span>${t}</span>
            </label>`).join('')}
        </div>
      </div>
      <div class="mb-4">
        <label class="label-be tiny font-bold mb-2">Departure Window</label>
        <select class="select-be srch-dep">
          <option value="any">Any Departure Time</option>
          <option value="morning">🌅 Morning (06:00 - 12:00)</option>
          <option value="afternoon">☀️ Afternoon (12:00 - 18:00)</option>
          <option value="evening">🌆 Evening (18:00 - 24:00)</option>
          <option value="night">🌙 Night (00:00 - 06:00)</option>
        </select>
      </div>
      <div>
        <label class="label-be tiny font-bold mb-2">Sort Results By</label>
        <select class="select-be srch-sort">
          <option value="featured">✨ Featured & Recommended (VIP & First Class First)</option>
          <option value="price_desc">💎 Luxury First (Highest Price)</option>
          <option value="rating">★ Highest Rated (4.9★ First)</option>
          <option value="price">Price: Lowest first</option>
          <option value="duration">Fastest Duration</option>
          <option value="departure">Early Departure</option>
        </select>
      </div>`;

    host.querySelector('.srch-dep').value = state.dep;
    host.querySelector('.srch-sort').value = state.sort;
    host.querySelector('.srch-mp').addEventListener('input', e=>{
      state.maxPrice = +e.target.value;
      const lbl = document.getElementById('mp-'+host.id);
      if (lbl) lbl.textContent = '₹' + e.target.value;
      renderAll();
    });
    const vipToggle = host.querySelector('.srch-vip-toggle');
    if (vipToggle) {
      vipToggle.addEventListener('change', e=>{
        state.vipOnly = e.target.checked;
        const otherHost = host.id === 'fb1' ? document.getElementById('fb2') : document.getElementById('fb1');
        const otherVip = otherHost?.querySelector('.srch-vip-toggle');
        if (otherVip) otherVip.checked = state.vipOnly;
        renderAll();
      });
    }
    host.querySelectorAll('.srch-type').forEach(cb=>cb.addEventListener('change', e=>{
      if (e.target.checked) state.types.push(e.target.value);
      else state.types = state.types.filter(x=>x!==e.target.value);
      renderAll();
    }));
    host.querySelector('.srch-dep').addEventListener('change', e=>{ state.dep=e.target.value; renderAll(); });
    host.querySelector('.srch-sort').addEventListener('change', e=>{ state.sort=e.target.value; renderAll(); });
  }

  const fb = document.getElementById('srch-filter-body'); fb.id='fb1'; buildFilters(fb);
  const fbm = document.getElementById('srch-filter-body-mobile'); fbm.id='fb2'; buildFilters(fbm);

  const resetBtn = document.getElementById('srch-reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', ()=>{
      state.maxPrice = 5000;
      state.types = [];
      state.dep = 'any';
      state.sort = 'featured';
      state.vipOnly = false;
      buildFilters(fb);
      buildFilters(fbm);
      renderAll();
      toast.info('Filters reset');
    });
  }

  function filtered(){
    return all
      .filter(b=>b.price<=state.maxPrice)
      .filter(b=>!state.vipOnly || (b.type && (b.type.includes('VIP') || b.type.includes('First Class'))))
      .filter(b=>!state.types.length || state.types.includes(b.type))
      .filter(b=>{
        if (state.dep==='any') return true;
        const h = +b.departure.split(':')[0];
        if (state.dep==='morning') return h>=6 && h<12;
        if (state.dep==='afternoon') return h>=12 && h<18;
        if (state.dep==='evening') return h>=18 && h<24;
        return h<6;
      })
      .sort((a,b)=>{
        if (state.sort === 'featured') {
          const aScore = (a.type && a.type.includes('VIP')) ? 3 : ((a.type && a.type.includes('First Class')) ? 2 : 1);
          const bScore = (b.type && b.type.includes('VIP')) ? 3 : ((b.type && b.type.includes('First Class')) ? 2 : 1);
          if (aScore !== bScore) return bScore - aScore;
          return +b.rating - +a.rating;
        }
        if (state.sort === 'price_desc') return b.price - a.price;
        if (state.sort === 'price') return a.price - b.price;
        if (state.sort === 'rating') return +b.rating - +a.rating;
        if (state.sort === 'departure') return a.departure.localeCompare(b.departure);
        return parseInt(a.duration) - parseInt(b.duration);
      });
  }

  const amenIcon = {
    'WiFi':'📶',
    'Charging Point':'🔌',
    'Blanket':'🛏️',
    'Water Bottle':'💧',
    'Reading Light':'💡',
    'Snacks':'🍪',
    'Live Tracking':'📍',
    'Movies':'📺'
  };

  function renderAll(){
    const list = filtered();
    document.getElementById('srch-count').textContent = list.length+' buses available';
    const host = document.getElementById('srch-results');
    if (!list.length){
      host.innerHTML = `
        <div class="be-card p-5 text-center shadow-soft" style="border-radius:1.5rem;">
          <div style="font-size:3.5rem;">🔍</div>
          <h4 class="font-bold mt-3 mb-1">No buses match these filters</h4>
          <p class="text-muted m-0">Try expanding your price range or clearing bus categories.</p>
          <button class="btn-be btn-primary-grad mt-3" onclick="document.getElementById('srch-reset-btn')?.click()">Reset Filters</button>
        </div>`;
      return;
    }
    host.innerHTML = list.map((b,i)=>{
      const isVip = b.type && (b.type.includes('VIP') || b.type.includes('Royal Executive'));
      const isFirstClass = b.type && b.type.includes('First Class');
      const luxuryBadge = isVip
        ? '<span class="px-2.5 py-1 rounded-pill text-xs font-bold" style="background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;box-shadow:0 2px 12px rgba(245,158,11,0.45);letter-spacing:0.02em;">💎 VIP ULTRA LUXURY</span>'
        : (isFirstClass
          ? '<span class="px-2.5 py-1 rounded-pill text-xs font-bold" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,0.45);letter-spacing:0.02em;">👑 FIRST CLASS CLUB</span>'
          : '');
      const cardBorder = isVip
        ? 'border:2px solid rgba(245,158,11,0.55);box-shadow:0 10px 30px -4px rgba(245,158,11,0.22);background:linear-gradient(180deg,rgba(245,158,11,0.03),transparent);'
        : (isFirstClass
          ? 'border:2px solid rgba(99,102,241,0.5);box-shadow:0 10px 30px -4px rgba(99,102,241,0.2);background:linear-gradient(180deg,rgba(99,102,241,0.03),transparent);'
          : '');

      const seatsBadge = b.seatsAvailable <= 5
        ? `<span class="badge rounded-pill bg-danger-subtle text-danger font-semibold">Only ${b.seatsAvailable} left!</span>`
        : `<span class="text-xs text-muted">${b.seatsAvailable} seats available</span>`;

      return `
      <div class="be-card p-4 transition-all hover-lift animate-fade-up shadow-sm" style="border-radius:1.25rem; animation-delay:${Math.min(i*.05, .3)}s; ${cardBorder}">
        <div class="row g-3 align-items-center">
          <div class="col-md">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div>
                <h6 class="font-extrabold text-lg m-0 d-flex align-items-center gap-2 flex-wrap">
                  <span>${b.name}</span>
                  ${luxuryBadge}
                  ${b.ecoFriendly?'<span class="px-2 py-0 rounded-pill text-xs font-semibold" style="background:rgba(16,185,129,.12);color:#059669;">🌿 Eco-Fleet</span>':''}
                </h6>
                <div class="text-sm text-muted mt-1 font-semibold">${b.type}</div>
              </div>
              <div class="d-inline-flex align-items-center gap-1 px-2.5 py-1 rounded-pill font-bold text-sm" style="${isVip ? 'background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(234,88,12,0.15));color:#d97706;' : 'background:rgba(16,185,129,.12);color:#059669;'}">
                ★ ${b.rating}
              </div>
            </div>
            <div class="d-flex align-items-center gap-3 mt-3">
              <div>
                <div class="font-extrabold font-mono text-xl">${b.departure}</div>
                <div class="text-xs text-muted">📍 ${from}</div>
              </div>
              <div class="flex-grow-1 position-relative" style="border-top:2px dashed hsl(var(--border)); min-width:80px;">
                <span class="position-absolute px-2 text-xs font-mono text-muted" style="left:50%; top:-.75rem; transform:translateX(-50%); background:hsl(var(--card)); white-space:nowrap;">
                  ⏱ ${b.duration}
                </span>
              </div>
              <div class="text-end">
                <div class="font-extrabold font-mono text-xl">${b.arrival}</div>
                <div class="text-xs text-muted">📍 ${to}</div>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-1 mt-3">
              ${b.amenities.map(a=>`<span class="px-2 py-1 rounded-pill text-xs font-medium" style="background:hsl(var(--muted));">${amenIcon[a]||'•'} ${a}</span>`).join('')}
            </div>
          </div>
          <div class="col-md-auto text-md-end border-md-start ps-md-4 d-flex flex-md-column justify-content-between align-items-end gap-3" style="min-width:180px;">
            <div>
              <div class="text-xs text-muted font-medium">${isVip || isFirstClass ? 'Premium Fare' : 'Starting from'}</div>
              <div class="text-3xl font-extrabold text-gradient">₹${b.price}</div>
              <div class="mt-1">${seatsBadge}</div>
            </div>
            <a class="btn-be btn-primary-grad w-100 shadow-elegant" style="height:2.75rem; font-weight:700;" href="/seats/?busId=${encodeURIComponent(b.id)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${date}">
              Select Seats →
            </a>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  renderAll();
});
</script>
{% endblock %}
